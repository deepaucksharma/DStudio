# Docker Compose for Complete Testing Environment
# संपूर्ण परीक्षण वातावरण के लिए Docker Compose

version: '3.8'

services:
  # Main testing framework
  hindi-podcast-tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
        VERSION: ${VERSION:-1.0.0}
    container_name: hindi-podcast-tests
    environment:
      - TEST_ENV=docker-compose
      - INDIAN_REGION=mumbai
      - WAIT_FOR_SERVICES=true
      - PYTHONPATH=/app
      - TEST_DB_URL=postgresql://testuser:testpass@postgres:5432/testdb
      - REDIS_URL=redis://redis:6379/0
      - CONSUL_URL=http://consul:8500
      - API_BASE_URL=http://api-mock:8080
    volumes:
      - .:/app
      - test-results:/app/test-results
      - test-logs:/app/logs
      - test-reports:/app/reports
      - test-coverage:/app/coverage
    ports:
      - "8080:8080"  # Test API port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - testing-network
    command: ["test", "all"]

  # PostgreSQL database for integration tests
  postgres:
    image: postgres:15
    container_name: test-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d testdb -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - testing-network

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: test-redis
    command: redis-server --appendonly yes --requirepass testpass
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - testing-network

  # Consul for service discovery
  consul:
    image: consul:1.16
    container_name: test-consul
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - consul-data:/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - testing-network
    command: >
      consul agent -server -bootstrap-expect=1 -data-dir=/consul/data
      -node=consul-1 -bind=0.0.0.0 -client=0.0.0.0 -ui

  # MongoDB for document storage testing
  mongodb:
    image: mongo:6.0
    container_name: test-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/testdb --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - testing-network

  # Elasticsearch for search testing
  elasticsearch:
    image: elasticsearch:8.9.0
    container_name: test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - testing-network

  # Kafka for message queue testing
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: test-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - testing-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: test-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - testing-network

  # Mock API server for testing
  api-mock:
    image: mockserver/mockserver:5.15.0
    container_name: test-api-mock
    environment:
      MOCKSERVER_WATCH_INITIALIZATION_JSON: "true"
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initialization.json
    volumes:
      - ./mocks:/config
    ports:
      - "1080:1080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - testing-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: test-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - testing-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: test-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: testpass
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - testing-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: test-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "14268:14268"  # jaeger-collector HTTP
      - "16686:16686"  # jaeger-query UI
      - "14250:14250"  # jaeger-collector gRPC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - testing-network

  # Load testing with k6
  k6-load-tests:
    image: grafana/k6:0.47.0
    container_name: k6-load-tests
    environment:
      K6_OUT: json=/tmp/results.json
      K6_SCENARIO: normal
      API_BASE_URL: http://api-mock:1080
    volumes:
      - ./load/k6-scripts:/scripts
      - test-results:/tmp
    networks:
      - testing-network
    profiles:
      - load-testing
    command: run /scripts/api-gateway-load-test.js

  # Security testing with OWASP ZAP
  owasp-zap:
    image: owasp/zap2docker-stable:2.12.0
    container_name: test-owasp-zap
    ports:
      - "8080:8080"
    volumes:
      - ./security/zap-config:/zap/wrk
    networks:
      - testing-network
    profiles:
      - security-testing
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true

  # Selenium Hub for E2E testing
  selenium-hub:
    image: selenium/hub:4.11.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    environment:
      GRID_MAX_SESSION: 16
      GRID_BROWSER_TIMEOUT: 300
      GRID_TIMEOUT: 300
    networks:
      - testing-network
    profiles:
      - e2e-testing

  # Chrome browser for E2E testing
  selenium-chrome:
    image: selenium/node-chrome:4.11.0
    container_name: selenium-chrome
    environment:
      HUB_HOST: selenium-hub
      HUB_PORT: 4444
      NODE_MAX_INSTANCES: 4
      NODE_MAX_SESSION: 4
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - selenium-hub
    networks:
      - testing-network
    profiles:
      - e2e-testing

  # Firefox browser for E2E testing
  selenium-firefox:
    image: selenium/node-firefox:4.11.0
    container_name: selenium-firefox
    environment:
      HUB_HOST: selenium-hub
      HUB_PORT: 4444
      NODE_MAX_INSTANCES: 4
      NODE_MAX_SESSION: 4
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - selenium-hub
    networks:
      - testing-network
    profiles:
      - e2e-testing

networks:
  testing-network:
    driver: bridge
    name: hindi-podcast-testing

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  consul-data:
    driver: local
  elasticsearch-data:
    driver: local
  zookeeper-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  test-results:
    driver: local
  test-logs:
    driver: local
  test-reports:
    driver: local
  test-coverage:
    driver: local