[tool:pytest]
# Episode 92-100 Testing Configuration
# हिंदी पॉडकास्ट टेस्टिंग कॉन्फ़िगरेशन

# Test discovery
testpaths = 
    unit/python
    integration
    e2e

# Test patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Minimum version
minversion = 6.0

# Add current directory to Python path
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=../
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --durations=10
    --maxfail=5
    -p no:warnings

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests
    load: Load/performance tests
    chaos: Chaos engineering tests
    security: Security tests
    e2e: End-to-end tests
    indian_context: Tests with Indian scenarios
    banking: Banking/FinTech related tests
    ecommerce: E-commerce related tests
    gaming: Gaming/Entertainment tests
    slow: Slow running tests
    external: Tests requiring external services
    destructive: Tests that may cause side effects

# Asyncio configuration
asyncio_mode = auto

# Test timeout (in seconds)
timeout = 300

# Parallel execution
junit_family = xunit2
junit_logging = all

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*

# Environment variables for testing
env =
    TEST_ENV = test
    INDIAN_REGION = mumbai
    UPI_TEST_MODE = true
    CHAOS_TESTING = false
    LOG_LEVEL = INFO