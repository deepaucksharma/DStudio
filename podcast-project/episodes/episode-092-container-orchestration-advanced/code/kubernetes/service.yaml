---
# ElasticSearch Service
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: flipkart-production
  labels:
    app: elasticsearch
    tier: search
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9200
    targetPort: 9200
    protocol: TCP
  - name: transport
    port: 9300
    targetPort: 9300
    protocol: TCP
  selector:
    app: elasticsearch

---
# Multi-region Service for Cross-region Communication
apiVersion: v1
kind: Service
metadata:
  name: flipkart-global-api
  namespace: flipkart-production
  labels:
    app: api-gateway
    scope: global
    regions: "mumbai,delhi,bangalore"
  annotations:
    # Global load balancer for cross-region traffic
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Custom domain for Indian users
    external-dns.alpha.kubernetes.io/hostname: "api.flipkart.com"
    external-dns.alpha.kubernetes.io/ttl: "300"
    # Geo-routing for Indian users
    geo-routing.aws/regions: "ap-south-1,ap-southeast-1"
    geo-routing.aws/primary: "ap-south-1"
spec:
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: api-gateway
  # Indian IP range optimization
  loadBalancerSourceRanges:
  - "14.0.0.0/8"      # BSNL India
  - "27.96.0.0/13"    # Airtel India
  - "49.14.0.0/15"    # Airtel India
  - "59.144.0.0/12"   # BSNL India
  - "103.5.140.0/22"  # Jio India
  - "106.51.0.0/16"   # Jio India
  - "117.192.0.0/10"  # BSNL India
  - "122.160.0.0/11"  # Airtel India
  - "150.129.0.0/16"  # Jio India
  - "157.44.0.0/16"   # Jio India
  - "180.151.0.0/16"  # Jio India
  - "202.54.0.0/15"   # Various Indian ISPs
  - "203.88.0.0/13"   # Various Indian ISPs

---
