---
# Headless Service for StatefulSet Services (Database, etc.)
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary-headless
  namespace: flipkart-production
  labels:
    app: postgres
    role: primary
    tier: data
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgres
    role: primary

---
# Redis Cluster Service
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: flipkart-production
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  ports:
