# Kubernetes ConfigMaps for Indian E-commerce Platform
# Episode 092: Container Orchestration - Configuration Management
# Context: Production configuration optimized for Indian market and compliance

---
# Application Configuration for Indian Market
apiVersion: v1
kind: ConfigMap
metadata:
  name: flipkart-app-config
  namespace: flipkart-production
  labels:
    app: flipkart
    tier: configuration
    region: mumbai
    compliance: rbi-compliant
  annotations:
    description: "Main application configuration for Indian e-commerce platform"
    last-updated: "2024-01-15T10:30:00Z"
    config-version: "v2.1.0"
data:
  # Indian Regional Settings
  application.yml: |
    spring:
      profiles:
        active: production,mumbai
      application:
        name: flipkart-ecommerce
      
    # Indian Locale and Timezone
    server:
      port: 8080
      servlet:
        context-path: /api/v1
      timezone: Asia/Kolkata
    
    # Indian Database Configuration
    datasource:
      url: jdbc:postgresql://postgres-primary:5432/flipkart?useSSL=true&requireSSL=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
    
    # Redis Configuration for Indian Infrastructure
    redis:
      host: redis-cluster
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
    
    # Elasticsearch Configuration
    elasticsearch:
      rest:
        uris: http://elasticsearch:9200
        username: elastic
        password: ${ELASTICSEARCH_PASSWORD}
        connection-timeout: 10s
        read-timeout: 30s
    
    # Kafka Configuration for Event Streaming
    kafka:
      bootstrap-servers: kafka-mumbai-1:9092,kafka-mumbai-2:9092,kafka-delhi-1:9092
      producer:
        acks: all
        retries: 3
        batch-size: 16384
        linger-ms: 5
        buffer-memory: 33554432
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      consumer:
        group-id: flipkart-${spring.application.name}
        auto-offset-reset: earliest
        enable-auto-commit: false
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        max-poll-records: 500
        session-timeout-ms: 30000
    
    # Indian Business Configuration
    flipkart:
      region: mumbai
      zones: 
        - mumbai-west
        - mumbai-east
        - mumbai-central
      supported-cities:
        - Mumbai
        - Delhi
        - Bangalore
        - Hyderabad
        - Chennai
        - Kolkata
        - Pune
        - Ahmedabad
        - Jaipur
        - Lucknow
      
      # Indian Currencies and Payment Methods
      currencies:
        primary: INR
        supported: [INR, USD]
      
      payment-methods:
        - UPI
        - Credit Card
        - Debit Card
        - Net Banking
        - Wallet
        - Cash on Delivery
        - EMI
      
      # Festival and Seasonal Configuration
      festivals:
        diwali: "2024-11-01"
        dussehra: "2024-10-24"
        holi: "2024-03-25"
        eid: "2024-04-10"
        christmas: "2024-12-25"
      
      # Business Hours (IST)
      business-hours:
        start: "06:00"
        end: "23:59"
        peak-start: "10:00"
        peak-end: "23:00"
      
      # Regional Language Support
      languages:
        default: en
        supported: [en, hi, ta, te, bn, mr, gu, kn, ml, or, pa, as]
      
      # GST Configuration
      gst:
        enabled: true
        rates:
          electronics: 18
          clothing: 12
          books: 0
          food: 5
        hsn-codes-required: true
      
      # RBI Compliance Settings
      compliance:
        rbi:
          enabled: true
          data-localization: true
          reporting-enabled: true
        pci-dss:
          enabled: true
          tokenization: true
          encryption: AES-256
        
    # Monitoring and Observability
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: when_authorized
        metrics:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
      tracing:
        sampling:
          probability: 0.1
    
    # Logging Configuration
    logging:
      level:
        com.flipkart: INFO
        org.springframework: WARN
        org.hibernate: WARN
        org.apache.kafka: WARN
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
      file:
        name: /app/logs/flipkart.log
        max-size: 100MB
        max-history: 30

  # Database Migration Configuration
  flyway.conf: |
    flyway.url=jdbc:postgresql://postgres-primary:5432/flipkart
    flyway.user=${DB_USERNAME}
    flyway.password=${DB_PASSWORD}
    flyway.locations=classpath:db/migration
    flyway.baseline-on-migrate=true
    flyway.validate-on-migrate=true
    flyway.repair-on-migrate=false
    flyway.schemas=public
    flyway.table=schema_version

---
# Payment Gateway Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-gateway-config
  namespace: flipkart-production
  labels:
    app: payment-service
    tier: configuration
    compliance: pci-dss
data:
  payment-config.yml: |
    payment:
      # Indian Payment Gateway Configuration
      gateways:
        razorpay:
          enabled: true
          base-url: https://api.razorpay.com/v1
          webhook-url: /webhooks/razorpay
          timeout: 30000
          retry-attempts: 3
          retry-delay: 1000
        
        paytm:
          enabled: true
          base-url: https://securegw.paytm.in/theia/api/v1
          webhook-url: /webhooks/paytm
          timeout: 30000
          retry-attempts: 3
        
        phonepe:
          enabled: true
          base-url: https://api.phonepe.com/apis/hermes/pg/v1
          webhook-url: /webhooks/phonepe
          timeout: 30000
          
        cashfree:
          enabled: true
          base-url: https://api.cashfree.com/pg/orders
          webhook-url: /webhooks/cashfree
        
        # UPI Configuration
        upi:
          enabled: true
          npci-url: https://api.npci.org.in/upi
          psp-id: FLIPKART
          vpa-suffix: "@flipkart"
          
      # Payment Limits (in INR)
      limits:
        upi:
          per-transaction: 100000
          daily: 200000
        card:
          per-transaction: 200000
          daily: 500000
        wallet:
          per-transaction: 50000
          daily: 100000
        netbanking:
          per-transaction: 500000
          daily: 1000000
      
      # RBI Compliance
      compliance:
        two-factor-auth: true
        transaction-logging: true
        fraud-detection: true
        tokenization: true
        data-masking: true
      
      # Security Configuration
      security:
        encryption:
          algorithm: AES-256-GCM
          key-rotation-days: 90
        ssl:
          enabled: true
          protocols: [TLSv1.2, TLSv1.3]
        rate-limiting:
          requests-per-minute: 100
          burst-capacity: 200

---
# Search and Recommendation Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-config
  namespace: flipkart-production
  labels:
    app: search-service
    tier: configuration
data:
  search-config.yml: |
    elasticsearch:
      cluster-name: flipkart-search
      nodes:
        - elasticsearch-mumbai:9200
        - elasticsearch-delhi:9200
      indices:
        products:
          name: products-v1
          shards: 5
          replicas: 1
          refresh-interval: 30s
        orders:
          name: orders-v1
          shards: 3
          replicas: 1
        users:
          name: users-v1
          shards: 2
          replicas: 1
      
    # Search Features
    search:
      # Indian Language Support
      languages:
        supported: [en, hi, ta, te, bn, mr]
        analyzers:
          hindi: hi_analyzer
          tamil: ta_analyzer
          bengali: bn_analyzer
      
      # Auto-complete and Suggestions
      autocomplete:
        enabled: true
        max-suggestions: 10
        min-query-length: 2
      
      # Search Ranking
      ranking:
        factors:
          - price
          - rating
          - availability
          - brand-popularity
          - user-preference
          - regional-preference
      
      # Regional Configuration
      regional:
        enabled: true
        boost-local-sellers: true
        regional-language-boost: 1.5
        local-delivery-boost: 1.2

---
# Monitoring Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: flipkart-monitoring
  labels:
    app: monitoring
    tier: infrastructure
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'flipkart-mumbai'
        region: 'ap-south-1'
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    
    rule_files:
      - "alert_rules.yml"
      - "recording_rules.yml"
    
    scrape_configs:
      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      # Kubernetes Nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      
      # Application Services
      - job_name: 'flipkart-services'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['flipkart-production']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name
  
  alert_rules.yml: |
    groups:
    - name: flipkart-alerts
      rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: platform
          region: mumbai
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for instance {{ $labels.instance }}"
      
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for instance {{ $labels.instance }}"
      
      # Service Down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} is down"
      
      # High API Response Time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is above 2 seconds for service {{ $labels.service }}"
      
      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolExhaustion
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database connection pool exhaustion"
          description: "Database connection pool usage is above 80% for {{ $labels.pool }}"
      
      # Kafka Consumer Lag
      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag_sum > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High Kafka consumer lag"
          description: "Kafka consumer lag is above 10000 messages for consumer group {{ $labels.consumer_group }}"

---
# Nginx Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: flipkart-production
  labels:
    app: nginx
    tier: proxy
data:
  nginx.conf: |
    worker_processes auto;
    worker_rlimit_nofile 65536;
    
    events {
        worker_connections 16384;
        use epoll;
        multi_accept on;
    }
    
    http {
        # Basic Settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;
        
        # MIME Types
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Buffer Sizes (optimized for Indian network conditions)
        client_body_buffer_size 128k;
        client_max_body_size 10m;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 32k;
        
        # Timeouts (optimized for Indian latency)
        client_body_timeout 60s;
        client_header_timeout 60s;
        send_timeout 60s;
        
        # Compression (essential for Indian bandwidth)
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Rate Limiting for Indian Traffic Patterns
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=search:10m rate=200r/m;
        limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        # Upstream Configuration
        upstream product_service {
            least_conn;
            server product-catalog:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        upstream order_service {
            least_conn;
            server order-management:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        upstream payment_service {
            least_conn;
            server payment-service-internal:8443 max_fails=2 fail_timeout=60s;
            keepalive 16;
        }
        
        # SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Main Server Block
        server {
            listen 80;
            listen 443 ssl http2;
            server_name api.flipkart.com;
            
            # SSL Certificates
            ssl_certificate /etc/ssl/certs/flipkart.crt;
            ssl_certificate_key /etc/ssl/private/flipkart.key;
            
            # Security Headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            
            # Indian Specific Headers
            add_header X-Served-By "Mumbai-India" always;
            add_header X-Region "ap-south-1" always;
            
            # Health Check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # API Routes
            location /api/v1/products {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://product_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                proxy_buffering on;
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
            }
            
            location /api/v1/orders {
                limit_req zone=api burst=15 nodelay;
                proxy_pass http://order_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }
            
            location /api/v1/payments {
                limit_req zone=api burst=5 nodelay;
                limit_conn conn_limit_per_ip 5;
                proxy_pass https://payment_service;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
            
            # Search API with higher rate limit
            location /api/v1/search {
                limit_req zone=search burst=50 nodelay;
                proxy_pass http://product_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache product_cache;
                proxy_cache_valid 200 5m;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }
        }
        
        # Cache Configuration
        proxy_cache_path /var/cache/nginx/product_cache levels=1:2 keys_zone=product_cache:10m max_size=1g inactive=60m use_temp_path=off;
    }

---
# Indian Regional Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: indian-regional-config
  namespace: flipkart-production
  labels:
    app: flipkart
    tier: configuration
    region: india
data:
  regional-settings.yml: |
    india:
      # Regional Zones and Data Centers
      regions:
        north:
          primary: delhi
          secondary: gurgaon
          cities: [delhi, gurgaon, noida, ghaziabad, faridabad, chandigarh, lucknow, kanpur, agra, meerut]
        west:
          primary: mumbai
          secondary: pune
          cities: [mumbai, pune, nashik, aurangabad, rajkot, vadodara, surat, ahmedabad, indore, bhopal]
        south:
          primary: bangalore
          secondary: hyderabad
          cities: [bangalore, hyderabad, chennai, coimbatore, kochi, trivandrum, mysore, hubli, mangalore, vijayawada]
        east:
          primary: kolkata
          secondary: bhubaneswar
          cities: [kolkata, bhubaneswar, guwahati, siliguri, durgapur, asansol]
      
      # Indian Festival Calendar (2024)
      festivals:
        national:
          - name: "Republic Day"
            date: "2024-01-26"
            sales-boost: 1.5
          - name: "Independence Day"
            date: "2024-08-15"
            sales-boost: 1.3
          - name: "Gandhi Jayanti"
            date: "2024-10-02"
            sales-boost: 1.2
        
        religious:
          - name: "Diwali"
            date: "2024-11-01"
            sales-boost: 3.0
            peak-days: 5
          - name: "Dussehra"
            date: "2024-10-24"
            sales-boost: 2.0
          - name: "Holi"
            date: "2024-03-25"
            sales-boost: 1.8
          - name: "Eid ul-Fitr"
            date: "2024-04-10"
            sales-boost: 2.2
          - name: "Eid ul-Adha"
            date: "2024-06-17"
            sales-boost: 1.5
          - name: "Navratri"
            date: "2024-10-15"
            sales-boost: 2.5
            duration: 9
          - name: "Karva Chauth"
            date: "2024-11-04"
            sales-boost: 1.7
          - name: "Dhanteras"
            date: "2024-10-29"
            sales-boost: 2.8
        
        regional:
          - name: "Onam"
            date: "2024-09-15"
            region: "south"
            sales-boost: 2.0
          - name: "Durga Puja"
            date: "2024-10-20"
            region: "east"
            sales-boost: 2.5
          - name: "Ganesh Chaturthi"
            date: "2024-09-07"
            region: "west"
            sales-boost: 2.2
          - name: "Pongal"
            date: "2024-01-15"
            region: "south"
            sales-boost: 1.8
      
      # Traffic Patterns
      traffic:
        peak-hours:
          weekday: ["10:00-12:00", "18:00-22:00"]
          weekend: ["10:00-23:00"]
          festival: ["00:00-23:59"]
        
        scaling-rules:
          normal: 1.0
          peak: 2.0
          festival: 5.0
          flash-sale: 10.0
      
      # Payment Methods by Region
      payment-preferences:
        north:
          upi: 45
          card: 30
          netbanking: 15
          cod: 8
          wallet: 2
        west:
          upi: 50
          card: 28
          netbanking: 12
          cod: 7
          wallet: 3
        south:
          upi: 48
          card: 32
          netbanking: 13
          cod: 5
          wallet: 2
        east:
          upi: 42
          card: 25
          netbanking: 18
          cod: 12
          wallet: 3
      
      # Language Preferences
      languages:
        north:
          primary: hi  # Hindi
          secondary: [en, pa, ur]  # English, Punjabi, Urdu
        west:
          primary: hi  # Hindi
          secondary: [en, mr, gu]  # English, Marathi, Gujarati
        south:
          primary: en  # English
          secondary: [ta, te, kn, ml]  # Tamil, Telugu, Kannada, Malayalam
        east:
          primary: bn  # Bengali
          secondary: [en, hi, or, as]  # English, Hindi, Odia, Assamese
      
      # Logistics and Delivery
      logistics:
