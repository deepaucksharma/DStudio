---
# Secrets Encryption Configuration
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: c2VjcmV0LWVuY3J5cHRpb24ta2V5LWZvcg==  # secret-encryption-key-for-flipkart
      - identity: {}

---
# RBAC for Secret Access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: flipkart-production
  name: secret-reader
  annotations:
    description: "Role for reading specific secrets"
    compliance: "RBI Guidelines"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "database-credentials"
    - "redis-credentials"
    - "elasticsearch-credentials"
    - "kafka-credentials"
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: flipkart-production
  name: payment-secret-reader
  annotations:
    description: "Role for reading payment-related secrets (PCI-DSS compliant)"
    compliance: "PCI-DSS Level 1"
    audit-logging: "enabled"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - "payment-gateway-credentials"
    - "jwt-signing-secret"
  verbs: ["get"]

---
# Network Policy for Secret Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-access-policy
  namespace: flipkart-production
  annotations:
    description: "Network policy for restricting secret access"
    compliance: "RBI Data Localization"
spec:
  podSelector:
    matchLabels:
      security-level: critical
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: flipkart-production
    - podSelector:
        matchLabels:
          app: payment-service
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: flipkart-production
    ports:
    - protocol: TCP
      port: 8200  # Vault port