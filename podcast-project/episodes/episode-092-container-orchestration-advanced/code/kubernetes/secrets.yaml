# Episode 092: Container Orchestration - Secrets Management
# Context: Production-grade secrets management with Indian compliance (PCI-DSS, RBI)

---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: flipkart-production
  labels:
    app: flipkart
    tier: database
    compliance: rbi-compliant
    encryption: aes-256
  annotations:
    description: "Database connection credentials for production"
    rotation-policy: "90-days"
    compliance: "PCI-DSS Level 1"
    access-review: "monthly"
    created-by: "platform-team"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "database-reader"
    vault.hashicorp.com/agent-inject-secret-db-password: "secret/data/flipkart/database"
type: Opaque
